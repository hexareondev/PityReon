# Положите в репозиторий: .github/workflows/update-achievements.yml
# Скрипт — achievements/fetch_achievements.py, базы — achievements/data/*.json
# Персонажи и оружие — items/fetch_items.py, базы — items/data/*.json
# Раз в неделю (и по кнопке) обновляет базы и коммитит изменения.
name: Обновление баз (достижения, персонажи)

on:
  schedule:
    - cron: "17 3 * * 3"   # среда, 03:17 UTC = 10:17 по Новосибирску
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # сообщить, если HoYoLAB перестал пускать (истекли cookie)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Скачать базы
        run: python achievements/fetch_achievements.py --out achievements/data --lang ru
      - name: Скачать базу персонажей и оружия
        run: python items/fetch_items.py
      - name: Найти персонажей на артах (для витрины)
        continue-on-error: true
        run: |
          python -m pip install --quiet pillow
          python items/art_focus.py
      - name: Рекомендуемые характеристики из HoYoLAB (для витрины)
        id: hoyo
        continue-on-error: true
        env:
          LTUID: ${{ secrets.LTUID }}
          LTOKEN: ${{ secrets.LTOKEN }}
          LTMID: ${{ secrets.LTMID }}
        run: |
          python -m pip install --quiet genshin
          python items/hoyo_rec.py
      - name: Сообщить, если HoYoLAB не ответил
        if: steps.hoyo.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t="HoYoLAB: не удалось обновить рекомендуемые характеристики"
          n=$(gh issue list --state open --search "$t in:title" --json number --jq '.[0].number // empty')
          body="Шаг «Рекомендуемые характеристики из HoYoLAB» завершился ошибкой: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Чаще всего это значит, что cookie HoYoLAB истекли. Возьмите новые ltuid_v2, ltoken_v2 и ltmid_v2 на hoyolab.com (F12 → Application → Cookies → .hoyolab.com) и замените секреты LTUID, LTOKEN, LTMID в Settings → Secrets and variables → Actions, затем запустите «Обновление баз» вручную.

          Сайт продолжает работать на последних сохранённых данных. Issue закроется сам после удачного обновления."
          if [ -n "$n" ]; then gh issue comment "$n" --body "Снова не получилось: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else gh issue create --title "$t" --body "$body"; fi
      - name: Закрыть сообщение об ошибке HoYoLAB, если всё снова работает
        if: steps.hoyo.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t="HoYoLAB: не удалось обновить рекомендуемые характеристики"
          for n in $(gh issue list --state open --search "$t in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "HoYoLAB снова отвечает — рекомендации обновлены."
          done
      - name: Закоммитить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add achievements/data/*_achievements.json items/data/*.json
          git diff --cached --quiet || git commit -m "Обновление баз достижений и персонажей"
          git push
