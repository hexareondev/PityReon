# Положите в репозиторий: .github/workflows/update-achievements.yml
# Скрипт — achievements/fetch_achievements.py, базы — achievements/data/*.json
# Персонажи и оружие — items/fetch_items.py, базы — items/data/*.json
# Раз в неделю (и по кнопке) обновляет базы и коммитит изменения.
name: Обновление баз (достижения, персонажи)

on:
  schedule:
    - cron: "17 3 * * 3"   # среда, 03:17 UTC = 10:17 по Новосибирску
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Скачать базы
        run: python achievements/fetch_achievements.py --out achievements/data --lang ru
      - name: Скачать базу персонажей и оружия
        run: python items/fetch_items.py
      - name: Найти персонажей на артах (для витрины)
        continue-on-error: true
        run: |
          python -m pip install --quiet pillow
          python items/art_focus.py
      - name: Рекомендуемые характеристики из HoYoLAB (для витрины)
        continue-on-error: true
        env:
          LTUID: ${{ secrets.LTUID }}
          LTOKEN: ${{ secrets.LTOKEN }}
          LTMID: ${{ secrets.LTMID }}
        run: |
          python -m pip install --quiet genshin
          python items/hoyo_rec.py
      - name: Закоммитить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add achievements/data/*_achievements.json items/data/*.json
          git diff --cached --quiet || git commit -m "Обновление баз достижений и персонажей"
          git push
